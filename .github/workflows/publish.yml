name: publish

# 版本驱动：main 上 package.json 的 version 与 registry 上的不同就发一版。
# 不建 tag、不建 Release —— 包的分发只走 npm。
on:
  push:
    branches: [main]
    paths: ['package.json', 'bin/**', 'template/**', 'scripts/**', '.github/workflows/publish.yml']
  workflow_dispatch:

# 一次只跑一个发布，且不打断进行中的发布
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # 将来换成 npm Trusted Publisher（OIDC）时不再需要改这里
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish when the registry version differs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # fork 上没有这个 secret：整步安静跳过（同一 workflow 在 fork 里只会构建，不会发布）
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN not configured — skipping publish"
            exit 0
          fi
          NAME=$(node -p "require('./package.json').name")
          PKG=$(node -p "require('./package.json').version")
          LIVE=$(npm view "$NAME" version 2>/dev/null || echo none)
          echo "$NAME: package.json=$PKG registry=$LIVE"
          if [ "$PKG" = "$LIVE" ]; then
            echo "version $PKG already published — nothing to do"
            exit 0
          fi
          npm publish --access public
